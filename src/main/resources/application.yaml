spring:
  application:
    name: change-data-management-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/cdms}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

cdms:
  polling:
    interval-ms: ${CDMS_POLLING_INTERVAL_MS:60000}
    enabled: ${CDMS_POLLING_ENABLED:true}

vietful:
  base-url: ${VIETFUL_BASE_URL:http://localhost:8080/vietful}
  connect-timeout-ms: ${VIETFUL_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${VIETFUL_READ_TIMEOUT_MS:10000}
  max-retries: ${VIETFUL_MAX_RETRIES:2}

scheduling:
  enabled: ${SCHEDULING_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.cdms: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
